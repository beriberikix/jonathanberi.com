name: Deploy to GitHub Pages

on:
  push:
    branches: [gh-pages]
  # Weekly rebuild so open source star counts stay fresh.
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Astro site
        uses: withastro/action@v3
        env:
          # Raises the GitHub API rate limit for build-time repo stats.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Astro 7 requires Node >= 22.12; the action defaults to Node 20.
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
